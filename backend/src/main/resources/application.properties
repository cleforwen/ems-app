# Application Configuration
quarkus.application.name=ems-backend
quarkus.http.port=8080

# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ems}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:ems}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:ems}

# Connection Pool Tuning (Critical for Render Free Tier)
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=30

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Validation
quarkus.hibernate-validator.fail-fast=true


# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.clean-at-start=false
quarkus.liquibase.validate-on-migrate=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Security & JWT
mp.jwt.verify.issuer=https://ems.com
quarkus.smallrye-jwt.enabled=true
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.verify.key.location=publicKey.pem

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,https://*.vercel.app,https://*.vercel.com
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, PUT, POST, DELETE, OPTIONS, PATCH

# Email Configuration
quarkus.mailer.from=no-reply@ems.com

# Google Authentication
ems.google.enabled=${EMS_GOOGLE_ENABLED:false}
ems.google.client-id=${EMS_GOOGLE_CLIENT_ID:none}

# Logging Configuration
quarkus.log.console.json=true
quarkus.log.console.json.additional-field."service".value=ems-backend
quarkus.log.console.json.additional-field."service".type=string
quarkus.log.category."com.ems".level=INFO
quarkus.log.category."io.quarkus".level=WARN
