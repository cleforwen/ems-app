# Production Profile

quarkus.hibernate-orm.log.sql=false
quarkus.log.console.level=INFO
quarkus.log.category."com.ems".level=INFO

# Bind to all interfaces for Render deployment
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
# Mailer (Production - Real SMTP)
# These will be typically provided via environment variables on Render
quarkus.mailer.host=${QUARKUS_MAILER_HOST:none}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:465}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:none}
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:none}
quarkus.mailer.ssl=${QUARKUS_MAILER_SSL:true}
quarkus.mailer.starttls=${QUARKUS_MAILER_STARTTLS:REQUIRED}
quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:false}
# Optional: Only use if seeing certificate issues
# quarkus.mailer.trust-all=${QUARKUS_MAILER_TRUST_ALL:false}

# Supabase Database Configuration
# Using environment variables for secure credential injection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# Supabase requires SSL to connect securely
quarkus.datasource.jdbc.additional-jdbc-properties.ssl=true
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=require



ems.google.enabled=true
